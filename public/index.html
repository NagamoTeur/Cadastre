<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastre</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="carte" aria-label="Carte des services"></div>

  <header class="bandeau">
    <div class="marque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Cadastre</span>
    </div>
    <div class="hote" id="hote">…</div>
    <label class="recherche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="recherche" type="search" placeholder="Chercher un service, une IP, un domaine…  /" autocomplete="off">
    </label>
    <div class="maj" id="maj" title="Dernière mise à jour"></div>
  </header>

  <aside class="legende" id="legende">
    <section>
      <h2>Quartiers</h2>
      <ul id="groupes"></ul>
    </section>
    <section>
      <h2>Liens</h2>
      <ul id="types"></ul>
    </section>
    <div class="actions">
      <button id="reorganiser" type="button" title="Range de nouveau chaque service dans sa parcelle">Réorganiser</button>
      <button id="cadrer" type="button" title="Cadre toute la carte">Tout voir</button>
    </div>
    <button id="redecouvrir" class="redecouvrir" type="button" title="Relance tout de suite le balayage des machines (sinon toutes les 10 min)">Relancer la découverte</button>
  </aside>

  <aside class="anomalies" id="anomalies">
    <button class="anomalies-tete" id="anomalies-tete" type="button" aria-expanded="true">
      <span>Anomalies</span>
      <span class="compteurs" id="compteurs"></span>
    </button>
    <ol id="anomalies-liste"></ol>
  </aside>

  <article class="fiche" id="fiche" hidden>
    <button class="fermer" id="fermer" type="button" aria-label="Fermer la fiche">×</button>
    <div id="fiche-contenu"></div>
  </article>

  <div class="bulle" id="bulle" hidden></div>

  <script src="vendor/cytoscape.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
