<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastre</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="carte" data-i18n-aria="titreCarte"></div>

  <header class="bandeau">
    <div class="marque">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Cadastre</span>
    </div>
    <div class="hote" id="hote">…</div>
    <label class="recherche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="recherche" type="search" data-i18n-placeholder="recherche" autocomplete="off">
    </label>
    <div class="maj" id="maj"></div>
    <button class="langue" id="langue" type="button" data-i18n="langue" data-i18n-title="langueAide"></button>
  </header>

  <aside class="legende" id="legende">
    <section>
      <h2 data-i18n="quartiers"></h2>
      <ul id="groupes"></ul>
    </section>
    <section>
      <h2 data-i18n="liens"></h2>
      <ul id="types"></ul>
    </section>
    <div class="actions">
      <button id="reorganiser" type="button" data-i18n="reorganiser" data-i18n-title="reorganiserAide"></button>
      <button id="cadrer" type="button" data-i18n="toutVoir" data-i18n-title="toutVoirAide"></button>
    </div>
    <button id="redecouvrir" class="redecouvrir" type="button" data-i18n="relancer" data-i18n-title="relancerAide"></button>
  </aside>

  <aside class="anomalies" id="anomalies">
    <button class="anomalies-tete" id="anomalies-tete" type="button" aria-expanded="true">
      <span data-i18n="anomalies"></span>
      <span class="compteurs" id="compteurs"></span>
    </button>
    <ol id="anomalies-liste"></ol>
  </aside>

  <article class="fiche" id="fiche" hidden>
    <button class="fermer" id="fermer" type="button" data-i18n-aria="fermerFiche">×</button>
    <div id="fiche-contenu"></div>
  </article>

  <div class="bulle" id="bulle" hidden></div>

  <script src="vendor/cytoscape.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
